[profile.default]
solc = "0.8.28" # pinned, so layout/anchoring.bin is reproducible
src = "src"
out = "out"
test = "test"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# On every build, or `forge inspect storage-layout` can hit a cached artifact without it.
extra_output = ["storageLayout"]
# No metadata hash, so a comment edit cannot change anchoring.bin.
bytecode_hash = "none"
# test/SeedFixture.t.sol writes layout/seed-fixture.json.
fs_permissions = [{ access = "read-write", path = "./layout" }]
# solady/forge-std pinned as git submodules (same commits as tips/verify/lib).
remappings = [
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]
